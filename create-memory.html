<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Create Memory</title>

<style>
body {
    font-family: Arial;
    background: linear-gradient(to right, #fbc2eb, #a6c1ee);
    text-align: center;
}

.container {
    background: white;
    padding: 20px;
    width: 350px;
    margin: 50px auto;
    border-radius: 15px;
}

input, select, textarea {
    width: 90%;
    padding: 10px;
    margin: 10px;
    border-radius: 8px;
}

.btn {
    background: linear-gradient(to right, pink, purple);
    color: white;
    padding: 10px 20px;
    border: none;
    border-radius: 20px;
    cursor: pointer;
}

.output {
    display: none;
    margin-top: 20px;
}
</style>

</head>
<body>

<div class="container">

    <h2>Create Memory</h2>

    <input type="text" placeholder="Title"><br>

    <select>
        <option>Birthday</option>
        <option>Wedding</option>
    </select><br>

    <input type="text" placeholder="Place"><br>

    <textarea placeholder="Description"></textarea><br>

    <input type="file" onchange="previewImage(event)"><br>

    <img id="preview" width="120" style="display:none;"><br><br>

    <button onclick="generateMemory()" class="btn">
        Generate Memory 🎨
    </button>

</div>

<!-- OUTPUT -->
<div id="outputBox" class="output">
    <h2>✨ Your AI Generated Birthday Memory 🎂</h2>

    <img id="generatedImage" width="250">

    <br><br>
    <button class="btn">Save Memory 💾</button>
</div>

<script>

// Preview uploaded image
function previewImage(event) {
    let reader = new FileReader();

    reader.onload = function () {
        let img = document.getElementById("preview");
        img.src = reader.result;
        img.style.display = "block";
    };

    reader.readAsDataURL(event.target.files[0]);
}

// Generate Memory (FIXED IMAGE)
function generateMemory() {

    let outputBox = document.getElementById("outputBox");
    let generatedImage = document.getElementById("generatedImage");

    // Show output
    outputBox.style.display = "block";

    // ALWAYS show birthday image
    generatedImage.src = "images/birthday.jpg";
}

</script>

</body>
</html>
