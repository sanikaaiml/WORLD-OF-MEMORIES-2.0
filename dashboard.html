<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <style>

        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ffd6e8, #d6f0ff);
            height: 100vh;
            overflow: hidden;
        }

        /* Floating doodles */
        .doodle {
            position: absolute;
            font-size: 25px;
            animation: float 6s infinite ease-in-out;
        }

        @keyframes float {
            0% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0); }
        }

        .d1 { top: 10%; left: 10%; }
        .d2 { top: 20%; right: 15%; }
        .d3 { bottom: 20%; left: 20%; }
        .d4 { bottom: 10%; right: 10%; }

        /* Main container */
        .container {
            text-align: center;
            padding-top: 100px;
        }

        h1 {
            font-size: 42px;
            color: #ff4fa3;
            animation: fadeIn 2s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Card */
        .card {
            margin: 40px auto;
            padding: 40px;
            width: 300px;
            border-radius: 20px;
            background: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: 0.3s;
        }

        .card:hover {
            transform: scale(1.05);
        }

        /* Button */
        .btn {
            display: inline-block;
            padding: 12px 25px;
            background: linear-gradient(45deg, #ff6ec4, #7873f5);
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn:hover {
            transform: scale(1.1);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

    </style>
</head>

<body>

<!-- ✨ DOODLES -->
<div class="doodle d1">💖</div>
<div class="doodle d2">✨</div>
<div class="doodle d3">🌸</div>
<div class="doodle d4">🎈</div>

<!-- 🌸 MAIN CONTENT -->
<div class="container">

    <h1>🌸 Welcome to World of Memories 🌸</h1>

    <div class="card">
        <h3>Create Your Beautiful Memory ✨</h3>
        <p>Turn your moments into magical memories 💫</p>

        <a href="create-memory.html" class="btn">
            Create Memory 📸
        </a>
    </div>

</div>

</body>
</html>
